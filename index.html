
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RANGSOR</title>

<style>
:root {
  --background: #10151f;
  --panel: #192231;
  --blue: #2389e8;
  --blue-light: #45a5ff;
  --blue-row: #1d4268;
  --blue-rank: #193a5c;
  --green: #65bc69;
  --green-light: #91df8b;
  --green-row: #285637;
  --green-rank: #21482c;
  --white: #fff;
  --muted: #9eacbf;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  background:
    radial-gradient(ellipse at top, #24364c 0%, transparent 60%),
    var(--background);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
}

.page {
  max-width: 1550px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin: 8px 0 32px;
}

.eyebrow {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 5px;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(42px, 5vw, 68px);
  font-weight: 900;
  letter-spacing: 5px;
}

.header-line {
  width: 100px;
  height: 5px;
  margin: 16px auto 0;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--blue), var(--green));
}

.rankings {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}

.sport-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid #ffffff18;
  border-radius: 15px;
  background: var(--panel);
  box-shadow: 0 16px 40px #0003;
}

.sport-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  min-height: 78px;
  padding: 18px 12px;
  color: white;
  font-size: clamp(24px, 2.5vw, 35px);
  font-weight: 800;
}

.football .sport-heading {
  background: linear-gradient(120deg, #1768b2, var(--blue));
  border-bottom: 3px solid var(--blue-light);
}

.volleyball .sport-heading {
  background: linear-gradient(120deg, #347d3c, var(--green));
  border-bottom: 3px solid var(--green-light);
}

.sport-icon {
  font-size: 1.05em;
}

/* Mindkét rangsor ugyanazt a táblázatformázást használja. */
.ranking-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: clamp(15px, 1.65vw, 23px);
}

.ranking-table td {
  height: 43px;
  padding: 8px 12px;
  border-bottom: 1px solid #ffffff12;
  line-height: 1.25;
}

.ranking-table tr:last-child td {
  border-bottom: none;
}

.ranking-table .rank {
  width: 62px;
  padding-right: 8px;
  padding-left: 8px;
  text-align: center;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.football .rank {
  color: #a8d5ff;
  background: var(--blue-rank);
}

.football .team-name {
  background: var(--blue-row);
  border-left: 3px solid #3188d4;
}

.volleyball .rank {
  color: #baf3b3;
  background: var(--green-rank);
}

.volleyball .team-name {
  background: var(--green-row);
  border-left: 3px solid #62b86a;
}

.team-name[contenteditable="true"] {
  cursor: text;
  overflow-wrap: anywhere;
  outline: none;
  transition: filter .15s, box-shadow .15s;
}

.team-name[contenteditable="true"]:hover {
  filter: brightness(1.13);
}

.team-name[contenteditable="true"]:focus {
  box-shadow: inset 0 0 0 2px white;
  filter: brightness(1.18);
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 28px auto 12px;
}

button {
  padding: 12px 19px;
  border: 1px solid #ffffff22;
  border-radius: 9px;
  background: #202d40;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

button:hover {
  background: #33465e;
  transform: translateY(-1px);
}

button.primary {
  background: #176fc0;
  border-color: #318de0;
}

button.primary:hover {
  background: #2488df;
}

button.green {
  background: #347d3c;
  border-color: #65bc69;
}

button.green:hover {
  background: #41984b;
}

.footer {
  margin-top: 18px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

body.projector {
  padding: 12px;
}

body.projector .header {
  margin: 0 0 16px;
}

body.projector .eyebrow,
body.projector .header-line,
body.projector .controls,
body.projector .footer {
  display: none;
}

body.projector h1 {
  font-size: clamp(35px, 4vw, 56px);
}

body.projector .rankings {
  gap: 18px;
}

body.projector .ranking-table {
  font-size: clamp(17px, 1.8vw, 27px);
}

body.projector .ranking-table td {
  height: auto;
  min-height: 43px;
  padding-top: clamp(7px, 1.1vh, 13px);
  padding-bottom: clamp(7px, 1.1vh, 13px);
}

@media (max-width: 760px) {
  body {
    padding: 12px;
  }

  .rankings {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .header {
    margin-bottom: 22px;
  }

  .ranking-table {
    font-size: 17px;
  }

  .ranking-table td {
    padding: 9px 8px;
  }

  .ranking-table .rank {
    width: 45px;
  }
}

@media print {
  body {
    padding: 0;
    background: white;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .eyebrow,
  .header-line,
  .controls,
  .footer {
    display: none;
  }

  .rankings {
    gap: 10px;
  }

  .sport-card {
    box-shadow: none;
  }
}
</style>
</head>

<body>
<div class="page">

  <header class="header">
    <h1>RANGSOR</h1>
    <div class="header-line"></div>
  </header>

  <main class="rankings">

    <section class="sport-card football">
      <div class="sport-heading">
        <span class="sport-icon">⚽</span>
        <span>Futball</span>
      </div>

      <table id="table" class="ranking-table">
        <tbody id="football-list"></tbody>
      </table>
    </section>

    <section class="sport-card volleyball">
      <div class="sport-heading">
        <span class="sport-icon">🏐</span>
        <span>Röplabda</span>
      </div>

      <table id="volleyball-table" class="ranking-table">
        <tbody id="volleyball-list"></tbody>
      </table>
    </section>

  </main>

  <div class="controls">
    <button class="primary" onclick="saveTable()">💾 Mentés</button>
    <button onclick="loadTable()">↩ Visszatöltés</button>
    <button class="green" onclick="toggleFullscreen()">📺 Kivetítő mód</button>
    <button onclick="window.print()">🖨 Nyomtatás</button>
  </div>

  <div class="footer">
    A csapatnevek a cellákra kattintva szerkeszthetők.
  </div>
</div>

<script>
const football = [
  "",
  "",
  "Gödöllő Premontrei",
  "Budakeszi Prohászka",
  "Gyulai Római Katolikus",
  "Kisvárdai Várday",
  "Miskolc Lévay",
  "Sátoraljaújhely Georgikon",
  "Hajdúdorog Szent Bazil",
  "Sárospataki Refi",
  "Nyíregyházi Szent Imre",
  "Kisvárdai Szent László",
  "Sátoraljaújhely Szent István"  
];

const volleyball = [
  "Bonyhárd Petőfi",
  "Miskolc Lévay",
  "Budakeszi Prohászka",
  "Miskolci Fráter",
  "Gyulai Római Katolikus",
  "Nyíregyháza Kossuth",
  "Budapest Lónyai",
  "Budapest Kolping",
  "Hajdúdorog Szent Bazil",
  "Gödöllői Premontrei",
  "Rózsakert Demjén",
  "Kisvárdai Várday",
  "Nyíregyháza Szent Imre",
  "Sárospataki Refi"
];

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderList(id, teams) {
  const tbody = document.getElementById(id);

  tbody.innerHTML = teams.map((team, index) => `
    <tr>
      <td class="rank">${index + 1}</td>
      <td class="team-name" contenteditable="true"
          spellcheck="false">${escapeHtml(team)}</td>
    </tr>
  `).join("");
}

function renderAll() {
  renderList("football-list", football);
  renderList("volleyball-list", volleyball);
}

function getCurrentTeams(id) {
  return [...document.querySelectorAll(
    `#${id} td.team-name`
  )].map(cell => cell.innerText.trim());
}

function saveTable() {
  const data = {
    football: getCurrentTeams("football-list"),
    volleyball: getCurrentTeams("volleyball-list")
  };

  try {
    localStorage.setItem("rangsor-data", JSON.stringify(data));
    alert("A rangsor sikeresen elmentve!");
  } catch (error) {
    alert("A mentés nem sikerült.");
  }
}

function loadTable() {
  try {
    const saved = localStorage.getItem("rangsor-data");

    if (!saved) {
      alert("Még nincs elmentett rangsor.");
      return;
    }

    if (!confirm("Betöltöd az előzőleg elmentett rangsort?")) {
      return;
    }

    const data = JSON.parse(saved);

    if (Array.isArray(data.football) &&
        Array.isArray(data.volleyball)) {
      football.splice(0, football.length, ...data.football);
      volleyball.splice(0, volleyball.length, ...data.volleyball);
      renderAll();
    }
  } catch (error) {
    alert("A mentett rangsort nem sikerült betölteni.");
  }
}

function toggleFullscreen() {
  document.body.classList.toggle("projector");

  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.()
      .catch(() => {});
  } else {
    document.exitFullscreen?.().catch(() => {});
  }
}

renderAll();
</script>
</body>
</html>
